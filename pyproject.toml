[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strelok-fs25-mod-updater"
version = "0.0.1a5"
description = "Graficzny aktualizator modów Farming Simulator 25 wydawanych przez StrelokPL"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "StrielokPL" }]
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "pyinstaller>=6.11",
]

[project.gui-scripts]
strelok-fs25-mod-updater = "strelok_fs25_mod_updater.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strelok_fs25_mod_updater = ["resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
