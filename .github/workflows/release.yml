name: Build application release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[release]')
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: StrelokFS25ModUpdater-Windows-x64
          - os: ubuntu-latest
            artifact: StrelokFS25ModUpdater-Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install . pyinstaller
      - name: Run tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -v
      - name: Build executable
        working-directory: packaging
        run: pyinstaller --clean --noconfirm StrelokFS25ModUpdater.spec
      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          packaging/dist/StrelokFS25ModUpdater --smoke-test
          packaging/dist/StrelokFS25ModUpdater --first-run-smoke-test
      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          & packaging/dist/StrelokFS25ModUpdater.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & packaging/dist/StrelokFS25ModUpdater.exe --first-run-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Name Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item packaging/dist/StrelokFS25ModUpdater.exe packaging/dist/StrelokFS25ModUpdater-Windows-x64.exe
      - name: Pack Linux executable
        if: runner.os == 'Linux'
        run: tar -C packaging/dist -czf packaging/dist/StrelokFS25ModUpdater-Linux-x64.tar.gz StrelokFS25ModUpdater
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packaging/dist/*.exe
            packaging/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Determine release metadata
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            verify_tag=true
          else
            version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
            release_tag="v${version}"
            verify_tag=false
          fi

          version="${release_tag#v}"
          if [[ "$version" =~ [[:alpha:]] ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "verify_tag=$verify_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFY_TAG: ${{ steps.release.outputs.verify_tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          args=(release create "$RELEASE_TAG" release-assets/* --title "$RELEASE_TAG" --generate-notes)

          if [[ "$VERIFY_TAG" == true ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi

          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
