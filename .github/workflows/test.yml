name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -v
      - name: Validate catalog
        run: python scripts/validate_catalog.py

  gui-import:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install application with Qt
        run: python -m pip install .
      - name: Launch GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -m strelok_fs25_mod_updater --smoke-test
          python -m strelok_fs25_mod_updater --first-run-smoke-test
          python -m strelok_fs25_mod_updater --task-smoke-test
