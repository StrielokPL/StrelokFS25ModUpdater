name: Publish official catalog

on:
  workflow_dispatch:
    inputs:
      catalog_version:
        description: "Numer catalogVersion do opublikowania"
        required: true
        type: number

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog
        run: python scripts/validate_catalog.py --version "${{ inputs.catalog_version }}"
      - name: Prepare catalog asset
        run: cp src/strelok_fs25_mod_updater/resources/official_catalog.json strelok-mod-catalog.json
      - name: Publish catalog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "catalog-v${{ inputs.catalog_version }}"
          strelok-mod-catalog.json
          --title "Official mod catalog v${{ inputs.catalog_version }}"
          --notes "Aktualizacja oficjalnej listy modów StrelokPL."

